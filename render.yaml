services:
  - type: web
    name: productify
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev --prefix backend && npm run build --prefix backend && npm ci --include=dev --prefix frontend && VITE_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY npm run build --prefix frontend
    startCommand: npm run db:push --prefix backend && node backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: productify-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

databases:
  - name: productify-db
    plan: free
    region: singapore
    databaseName: productify
    user: productify
    ipAllowList: []
